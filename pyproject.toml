[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "fhy_core"
version = "0.1.7"
description = "Core utilities for the FhY compiler infrastructure."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
   {name = "Christopher Priebe", email = "cpriebe@ucsd.edu"},
]
maintainers = [
   {name = "Christopher Priebe", email = "cpriebe@ucsd.edu"},
]
requires-python = ">=3.10"
keywords = [
   "Compiler",
]
classifiers = [
   "Development Status :: 3 - Alpha",
   "Programming Language :: Python :: 3",
   "Programming Language :: Python :: 3.10",
   "Programming Language :: Python :: 3.11",
   "Programming Language :: Python :: 3.12",
   "Programming Language :: Python :: 3.13",
   "Programming Language :: Python :: 3.14",
]
dependencies = [
   "frozendict",
   "networkx",
   "sympy",
   "z3-solver",
   "typing_extensions; python_version < '3.12'",
]

[project.urls]
Homepage = "https://github.com/actlab-fhy/FhY-core"
Issues = "https://github.com/actlab-fhy/FhY-core/issues"

[dependency-groups]
test = ["pytest", "coverage[toml]", "pytest-xdist"]
property = ["hypothesis", {include-group = "test"}]
lint = ["ruff"]
type = ["ty", "mypy", {include-group = "test"}]
mutation = ["cosmic-ray", {include-group = "test"}]
dev = [
   {include-group = "test"},
   {include-group = "property"},
   {include-group = "lint"},
   {include-group = "type"},
   "nox",
   "pre-commit",
   "pre-commit-hooks",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto -rfEs --strict-markers --durations=20 -m 'not slow'"
markers = [
    "slow: takes more than ~1s; excluded from default run",
    "very_slow: takes more than ~30s; nightly only",
    "subprocess: spawns a Python subprocess",
    "z3: requires the z3-solver package",
    "integration: exercises multiple modules together",
    "network: requires network access",
    "property: hypothesis-based property test",
]

[tool.coverage.run]
parallel = true
branch = true
source = ["fhy_core"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.report]
format = "markdown"
fail_under = 85.0
precision = 1
show_missing = true
skip_empty = true
skip_covered = true
exclude_also = [
   "def __repr__",
   'if __name__ == "__main__"'
]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
# ty defaults to strict inference; start clean and only relax on real friction.

[tool.mypy]
pretty = false
strict = true
enable_error_code = ["explicit-override"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = [
   "D",  # PyDocstyle
   "E",  # pycodestyle
   "F",  # Pyflakes
   "I",  # Isort
   "PL",  # Pylint
   "W",  # Warning
]
ignore = [
   "D105",  # undocumented-magic-method
   "D107",  # undocumented-public-init
   "D203",  # one-blank-line-before-class (conflicts with D211)
   "D213",  # multi-line-summary-second-line (conflicts with D212)
   "PLR0913",  # too-many-arguments
   "RET505",  # superfluous-else-return
   "RET506",  # superfluous-else-raise
   "RET507",  # superfluous-else-continue
   "RET508",  # superfluous-else-break
]

[tool.ruff.lint.pydocstyle]
convention = "google"  # Accepts: "google" | "numpy" | "pep257"
# Protocol/base-class implementations carry @override; their contract is
# documented on the trait, so exempt them from missing-docstring checks (D10x).
ignore-decorators = [
   "typing.override",
   "typing_extensions.override",
   "fhy_core.utils.override.override",
]

[tool.ruff.lint.isort]
known-first-party = ["fhy_core"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
   "E402",  # Import Statement not at Top of File
   "F401",  # Unused Imports
]
"tests/*.py" = [
   "D",  # PyDocstyle
   "F841",  # unused-variable (F841)
   "PLR2004",  # magic-value-comparison (PLR2004)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
