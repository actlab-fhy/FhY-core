ci:
  autoupdate_schedule: quarterly

# All hooks run from the project's uv environment (`language: system` + `uv run`).
# pre-commit installs no hook environments and needs no network: the tools come
# from the `dev` dependency group (ruff, pre-commit-hooks) and always match the
# project's pinned versions. Requires `uv` on PATH when committing.
repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run trailing-whitespace-fixer
        language: system
        types: [text]
        exclude: ^tests/(integration|unit)/data/
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run end-of-file-fixer
        language: system
        types: [text]
        exclude: ^tests/(integration|unit)/data/
      - id: check-yaml
        name: check yaml
        entry: uv run check-yaml
        language: system
        types: [yaml]
      - id: check-added-large-files
        name: check for added large files
        entry: uv run check-added-large-files
        language: system
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      # Rerun the golden-corpus generators when the Python oracle, a generator
      # or a corpus changes, so a stale corpus fails here rather than in CI.
      # -n0: the generators finish in about 1.5 s run serially, sooner than
      # xdist workers start.
      - id: golden-corpora
        name: golden corpora match their generators
        entry: uv run pytest -q -n0 tests/test_golden_corpora.py
        language: system
        files: ^(src/fhy_core/|rust/tests/golden/|tests/test_golden_corpora\.py$)
        pass_filenames: false
