# Install dependencies, lint, type-check, and test across Python versions/OSes.
# Driven by uv (env/deps) and nox (sessions). See noxfile.py.
#
# The config job selects a LEAN matrix (ubuntu x py3.10/3.14) for everyday dev
# PRs and a FULL matrix (3 OSes x 5 Pythons) for release gates (-> main), main
# pushes, and manual dispatch. The property job (hypothesis suites) and the
# golden-expanded job (large random golden corpora replayed through the Rust
# equivalence tests) run only on release gates (PRs -> main) and manual
# dispatch — never on dev PRs.
#
# The rust and rust-msrv jobs cover the crate directly, and the deny job checks
# its dependency graph with cargo-deny (deny.toml): the Python jobs build it
# into the extension module the package requires and reach it only through
# the Python API. The tests job also checks the golden corpora those crate tests
# replay against the Python generators that record them
# (tests/test_golden_corpora.py).
# ci-ok aggregates the required jobs into one check.

name: FhY-core CI

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**/*.md", "docs/**" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  style:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Code Linting & Formatting
        if: always()
        run: uv run nox -s lint
      - name: Static Type Safety Check
        if: always()
        run: uv run nox -s type_check

  rust:
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install z3 and SymPy
        # The z3 feature's z3-sys 0.13 links libz3 4.13.3 or newer, which
        # Ubuntu does not ship, so the job links the libz3 of the z3-solver
        # wheel. The wheel's z3 executable runs the process backend's
        # stories against a real solver (FHY_SMT_SOLVER).
        # SymPy serves the binding's tests: fhy-core-py holds the SymPy
        # backend, and its stories embed the venv's Python, which pyo3 links
        # (PYO3_PYTHON), and find SymPy on PYTHONPATH, since an embedded
        # interpreter does not read the venv's pyvenv.cfg. fhy-core itself
        # needs no Python. GITHUB_ENV hands both to every later step, so
        # each cargo test that builds the binding runs the SymPy stories,
        # which fail without SymPy.
        run: |
          python3 -m venv "$RUNNER_TEMP/z3"
          "$RUNNER_TEMP/z3/bin/pip" install --quiet z3-solver sympy
          lib="$("$RUNNER_TEMP/z3/bin/python" -c 'import os, z3; print(os.path.join(os.path.dirname(z3.__file__), "lib"))')"
          version="$("$RUNNER_TEMP/z3/bin/python" -c 'import z3; print(z3.get_version_string())')"
          site="$("$RUNNER_TEMP/z3/bin/python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          libpython="$("$RUNNER_TEMP/z3/bin/python" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          {
            echo "Z3_LIBRARY_PATH_OVERRIDE=$lib"
            echo "Z3_SYS_Z3_VERSION=$version"
            echo "LD_LIBRARY_PATH=$lib:$libpython"
            echo "FHY_SMT_SOLVER=$RUNNER_TEMP/z3/bin/z3 -in"
            echo "PYO3_PYTHON=$RUNNER_TEMP/z3/bin/python"
            echo "PYTHONPATH=$site"
          } >> "$GITHUB_ENV"
      - name: Code Formatting
        run: cargo fmt --all --check
      - name: Code Linting
        # fhy-core-py pulls in pyo3, so the workspace clippy run also checks
        # it; clippy only checks, so that costs no libpython. fhy-core has no
        # pyo3.
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Per-Crate Linting
        # A workspace build unifies the binding's features into fhy-core, so
        # the crate is also linted as a dependent builds it: with no
        # features, and with each feature alone.
        run: |
          for features in "" "--features z3" "--features ndarray"; do
            cargo clippy -p fhy-core --all-targets --locked $features -- -D warnings
          done
      - name: Integration Test Targets
        # Every integration test shares the `it` binary. A test that needs a
        # fresh process is its own single-test target and is listed here on
        # purpose: id_cap_decode moves the global id counter to the cap.
        run: |
          expected="id_cap_decode it"
          actual="$(cargo metadata --no-deps --format-version 1 --locked | python3 -c '
          import json, sys
          metadata = json.load(sys.stdin)
          (package,) = [p for p in metadata["packages"] if p["name"] == "fhy-core"]
          print(" ".join(sorted(t["name"] for t in package["targets"] if t["kind"] == ["test"])))
          ')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::fhy-core test targets are '$actual', expected '$expected'."
            exit 1
          fi
      - name: Unit, Integration & Doc Testing
        # pyo3 leaves libpython unlinked only when maturin sets
        # PYO3_BUILD_EXTENSION_MODULE for a wheel build, so a plain cargo
        # build links the runner's Python and the fhy-core-py test binary,
        # which holds the SymPy backend's stories, runs. --all-features builds
        # the z3 feature and runs its stories.
        run: cargo test --workspace --locked --all-features
      - name: Default-Feature Testing
        # The solver's stories without the z3 feature run the process
        # backend against the z3 executable instead.
        run: 'cargo test --locked -p fhy-core --test it solver::'
      - name: Documentation
        # fhy-core alone with its default features, as a dependent without
        # features builds it, then the workspace, whose features the binding
        # unifies and whose fresh docs the public-paths check below reads.
        # docs.rs builds fhy-core with both features and `--cfg docsrs`
        # (`[package.metadata.docs.rs]`), which only a nightly rustdoc takes.
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          rm -rf target/doc
          cargo doc -p fhy-core --no-deps --locked
          cargo doc --workspace --no-deps --locked
      - name: Public Paths
        # Each public item has exactly one path: no glob re-exports, no module
        # re-exports another public module's item, and no item name appears
        # under two paths.
        run: |
          globs="$(grep -rnE '^\s*pub use [^;]*\*' rust/fhy-core/src || true)"
          if [[ -n "$globs" ]]; then
            echo "::error::glob re-exports: $globs"
            exit 1
          fi
          doc=target/doc/fhy_core
          reexports="$(grep -l 'id="reexports"' $(find "$doc" -name index.html) || true)"
          if [[ -n "$reexports" ]]; then
            echo "::error::a module re-exports an item that already has a public path: $reexports"
            exit 1
          fi
          duplicates="$(grep -oE 'href="[^"#]+\.html"' "$doc/all.html" | grep -v '"\.\./' \
            | sed -E 's#^href="(.*/)?[a-z]+\.([A-Za-z0-9_]+)\.html"$#\2#' | sort | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "::error::items with more than one public path: $duplicates"
            exit 1
          fi
      - name: Packaging
        # Pack fhy-core, the only publishable workspace member, as crates.io
        # would receive it and build the library from it.
        run: cargo package --locked -p fhy-core
      - name: Package Contents
        # The include list ships Rust sources, tests and golden JSON, and no
        # Python file: the SymPy backend and its prelude live in the binding.
        run: |
          unexpected="$(cargo package --list --locked -p fhy-core | grep -Ev \
            '^(Cargo\.toml(\.orig)?|Cargo\.lock|\.cargo_vcs_info\.json|README\.md|LICENSE|src/.+\.rs|tests/.+\.rs|tests/golden/[a-z_]+\.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::the package ships unexpected files: $unexpected"
            exit 1
          fi
      - name: Testing the Packaged Crate
        # cargo package only builds the library, so run the tests from the
        # packed crate as a consumer would get them.
        run: |
          tar -xzf target/package/fhy-core-*.crate -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/fhy-core-*/
          cargo test --locked

  deny:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Licenses, Bans & Sources
        # deny.toml: every dependency permissively licensed, from crates.io,
        # with no wildcard version requirement.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
      - name: Security Advisories
        # A new RustSec advisory against an existing dependency must be seen,
        # but it should not block unrelated pull requests, so this step warns
        # rather than fails the job.
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  rust-msrv:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read the MSRV
        # From Cargo.toml, so the version tested is the version promised.
        id: msrv
        run: |
          VERSION="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::No rust-version in Cargo.toml."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "MSRV -> $VERSION"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        # The ref pins the action; the input picks the Rust version.
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build the Library on the MSRV
        # `cargo +<toolchain>`: rust-toolchain.toml pins the channel to stable
        # and would otherwise win over the toolchain installed here.
        run: |
          cargo +${{ steps.toolchain.outputs.name }} check --workspace --lib --locked
      - name: Build fhy-core's Targets on the MSRV
        # The crate alone, with its tests, with no features and with each
        # feature alone, as a dependent on the MSRV builds it; a warning the
        # MSRV's lints raise fails the step.
        env:
          RUSTFLAGS: -D warnings
        run: |
          for features in "" "--features z3" "--features ndarray"; do
            cargo +${{ steps.toolchain.outputs.name }} check -p fhy-core --all-targets --locked $features
          done

  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.decide.outputs.matrix }}
      failfast: ${{ steps.decide.outputs.failfast }}
    steps:
      - id: decide
        shell: bash
        run: |
          FULL='{"os":["ubuntu-latest","macOS-latest","windows-latest"],"python-version":["3.10","3.11","3.12","3.13","3.14"]}'
          LEAN='{"os":["ubuntu-latest"],"python-version":["3.10","3.14"]}'

          # Default = everyday PRs into dev.
          MATRIX="$LEAN"; FAILFAST="true"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MATRIX="$FULL"; FAILFAST="false"        # manual run = full sweep
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.base_ref }}" == "main" ]]; then
            MATRIX="$FULL"; FAILFAST="false"        # release gate: dev -> main
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            MATRIX="$FULL"; FAILFAST="false"        # push to main (post-merge)
          fi

          echo "matrix=$MATRIX"     >> "$GITHUB_OUTPUT"
          echo "failfast=$FAILFAST" >> "$GITHUB_OUTPUT"
          echo "Decided -> matrix=$MATRIX  fail-fast=$FAILFAST"

  tests:
    needs: [config]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: ${{ fromJSON(needs.config.outputs.failfast) }}
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Unit & Integration Testing
        run: uv run nox -s "tests-${{ matrix.python-version }}"
      - name: Save Coverage Data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.python-version }}
          path: .coverage.*
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  tests-minimal:
    # The suite without the optional solver packages (sympy, z3-solver), on
    # one Python version: a test that reaches a solver backend is marked
    # sympy or z3 and skipped here, and an unmarked one fails with
    # SolverBackendUnavailableError, so a wrong mark cannot hide.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Testing without the Solver Packages
        run: uv run nox -s tests_minimal

  property:
    # Release gate only: hypothesis property suites are slow and probe deep
    # soundness invariants, so they gate PRs into main (version releases) and
    # manual full sweeps, not everyday feature PRs into dev.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Property-Based Testing
        run: uv run nox -s property

  golden-expanded:
    # Release gate only, like property (see the header).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
      - name: Expanded Golden Corpus Equivalence
        run: uv run nox -s golden_expanded

  coverage:
    runs-on: "ubuntu-latest"
    needs: [tests]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Report Testing Coverage
        run: |
          set -o pipefail
          uv run nox -s coverage | tee $GITHUB_STEP_SUMMARY
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  ci-ok:
    if: always()
    needs: [style, rust, rust-msrv, deny, tests, tests-minimal, property, golden-expanded]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          required=(style rust rust-msrv deny tests tests-minimal)
          # Conditional jobs skip on dev PRs, so skipped is fine for them;
          # any other result besides success is not.
          conditional=(property golden-expanded)
          failed=0
          checked=" ${required[*]} ${conditional[*]} "
          for job in $(jq -r 'keys[]' <<<"$NEEDS"); do
            if [[ "$checked" != *" $job "* ]]; then
              echo "::error::The $job job is needed but not checked here."
              failed=1
            fi
          done
          for job in "${required[@]}"; do
            result=$(jq -r --arg job "$job" '.[$job].result' <<<"$NEEDS")
            echo "$job: $result"
            if [[ "$result" != "success" ]]; then
              echo "::error::The required $job job did not succeed."
              failed=1
            fi
          done
          for job in "${conditional[@]}"; do
            result=$(jq -r --arg job "$job" '.[$job].result' <<<"$NEEDS")
            echo "$job: $result"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::The $job job ran and did not succeed."
              failed=1
            fi
          done
          if (( failed )); then
            exit 1
          fi
          echo "All required jobs passed."
