# Install dependencies, lint, type-check, and test across Python versions/OSes.
# Driven by uv (env/deps) and nox (sessions). See noxfile.py.
#
# The config job selects a LEAN matrix (ubuntu x py3.10/3.14) for everyday dev
# PRs and a FULL matrix (3 OSes x 5 Pythons) for release gates (-> main), main
# pushes, and manual dispatch. The property job (hypothesis suites) runs only
# on release gates (PRs -> main) and manual dispatch — never on dev PRs.
#
# The rust and rust-msrv jobs cover the crate directly: the Python jobs only
# compile it as an extension module and reach it through the identifier
# bindings. The tests job also checks the golden corpora those crate tests
# replay against the Python generators that record them
# (tests/test_golden_corpora.py).
# ci-ok aggregates the required jobs into one check.

name: FhY-core CI

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**/*.md", "docs/**" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  style:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Code Linting & Formatting
        if: always()
        run: uv run nox -s lint
      - name: Static Type Safety Check
        if: always()
        run: uv run nox -s type_check

  rust:
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
      - name: Code Formatting
        run: cargo fmt --all --check
      - name: Code Linting
        # Clippy only checks, so the python feature costs it no libpython.
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Unit, Integration & Doc Testing
        # --all-features compiles the python feature into the test binaries
        # too. pyo3 leaves libpython unlinked only when maturin sets
        # PYO3_BUILD_EXTENSION_MODULE for a wheel build, so a plain cargo
        # build links the runner's Python and the test binaries run.
        run: cargo test --locked --all-features
      - name: Packaging
        # Pack the crate as crates.io would receive it (the include list in
        # Cargo.toml decides what that is) and build the library from it.
        run: cargo package --locked
      - name: Testing the Packaged Crate
        # cargo package only builds the library, so run the tests from the
        # packed crate as a consumer would get them. The published manifest
        # loses this crate's dev-dependency on itself, which carries only a
        # path, so the testing feature is named here instead.
        run: |
          tar -xzf target/package/fhy-core-*.crate -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/fhy-core-*/
          cargo test --locked --features testing

  rust-msrv:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read the MSRV
        # From Cargo.toml, so the version tested is the version promised.
        id: msrv
        run: |
          VERSION="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::No rust-version in Cargo.toml."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "MSRV -> $VERSION"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        # The ref pins the action; the input picks the Rust version.
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build the Library on the MSRV
        # `cargo +<toolchain>`: rust-toolchain.toml pins the channel to stable
        # and would otherwise win over the toolchain installed here. Both
        # feature sets, since each drops code the other compiles.
        run: |
          cargo +${{ steps.toolchain.outputs.name }} check --lib --locked
          cargo +${{ steps.toolchain.outputs.name }} check --lib --all-features --locked

  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.decide.outputs.matrix }}
      failfast: ${{ steps.decide.outputs.failfast }}
    steps:
      - id: decide
        shell: bash
        run: |
          FULL='{"os":["ubuntu-latest","macOS-latest","windows-latest"],"python-version":["3.10","3.11","3.12","3.13","3.14"]}'
          LEAN='{"os":["ubuntu-latest"],"python-version":["3.10","3.14"]}'

          # Default = everyday PRs into dev.
          MATRIX="$LEAN"; FAILFAST="true"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MATRIX="$FULL"; FAILFAST="false"        # manual run = full sweep
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.base_ref }}" == "main" ]]; then
            MATRIX="$FULL"; FAILFAST="false"        # release gate: dev -> main
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            MATRIX="$FULL"; FAILFAST="false"        # push to main (post-merge)
          fi

          echo "matrix=$MATRIX"     >> "$GITHUB_OUTPUT"
          echo "failfast=$FAILFAST" >> "$GITHUB_OUTPUT"
          echo "Decided -> matrix=$MATRIX  fail-fast=$FAILFAST"

  tests:
    needs: [config]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: ${{ fromJSON(needs.config.outputs.failfast) }}
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Unit & Integration Testing
        run: uv run nox -s "tests-${{ matrix.python-version }}"
      - name: Save Coverage Data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.python-version }}
          path: .coverage.*
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  property:
    # Release gate only: hypothesis property suites are slow and probe deep
    # soundness invariants, so they gate PRs into main (version releases) and
    # manual full sweeps, not everyday feature PRs into dev.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Property-Based Testing
        run: uv run nox -s property

  coverage:
    runs-on: "ubuntu-latest"
    needs: [tests]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Report Testing Coverage
        run: |
          set -o pipefail
          uv run nox -s coverage | tee $GITHUB_STEP_SUMMARY
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  ci-ok:
    if: always()
    needs: [style, rust, rust-msrv, tests, property]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs succeeded
        run: |
          echo "style: ${{ needs.style.result }}"
          echo "rust: ${{ needs.rust.result }}"
          echo "rust-msrv: ${{ needs['rust-msrv'].result }}"
          echo "tests: ${{ needs.tests.result }}"
          echo "property: ${{ needs.property.result }}"
          if [[ "${{ needs.style.result }}" != "success" \
             || "${{ needs.rust.result }}" != "success" \
             || "${{ needs['rust-msrv'].result }}" != "success" \
             || "${{ needs.tests.result }}" != "success" ]]; then
            echo "::error::A required job did not succeed."
            exit 1
          fi
          # property is conditional: skipped is fine (dev PRs), failure is not.
          if [[ "${{ needs.property.result }}" != "success" && "${{ needs.property.result }}" != "skipped" ]]; then
            echo "::error::The property job ran and did not succeed."
            exit 1
          fi
          echo "All required jobs passed."
