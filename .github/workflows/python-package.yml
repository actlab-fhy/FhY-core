# Install dependencies, lint, type-check, and test across Python versions/OSes.
# Driven by uv (env/deps) and nox (sessions). See noxfile.py.

name: FhY-core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  FORCE_COLOR: "1"

jobs:
  style:
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Code Linting & Formatting
        if: always()
        run: uv run nox -s lint

      - name: Static Type Safety Check
        if: always()
        run: uv run nox -s type_check

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macOS-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Unit & Integration Testing
        run: uv run nox -s "tests-${{ matrix.python-version }}"

      - name: Save Coverage Data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.python-version }}
          path: .coverage.*
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    runs-on: "ubuntu-latest"
    needs: [tests]
    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Report Testing Coverage
        run: |
          set -o pipefail
          uv run nox -s coverage | tee $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
