name: Release and Upload Rust Crates

# A published release also publishes the fhy-core and fhy-core-py crates to
# crates.io, through Trusted Publishing (OIDC). crates.io accepts a trusted
# publisher only for a crate that already exists, so each crate's first
# version is published by hand, and a version already on crates.io is skipped
# rather than refused.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  crates-io:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      # Required for crates.io Trusted Publishing (OIDC); no API token needed.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read the Pinned Rust Version
        # From rust-toolchain.toml, so the release builds with the toolchain
        # CI lints with.
        id: pinned
        run: |
          VERSION="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::No channel in rust-toolchain.toml."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.pinned.outputs.version }}
        # The ref pins the action; the input picks the Rust version.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.pinned.outputs.version }}
      - name: Check the Release Tag and the Published Versions
        # The tag must name the workspace version, `v<version>`. The crates.io
        # API asks every client for a User-Agent that identifies it.
        id: crates
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "fhy-core") | .version')"
          if [[ "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not name version $VERSION."
            exit 1
          fi
          UNPUBLISHED=()
          for CRATE in fhy-core fhy-core-py; do
            STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --user-agent 'FhY-core release workflow (https://github.com/actlab-fhy/FhY-core)' \
              "https://crates.io/api/v1/crates/$CRATE/$VERSION")"
            if [[ "$STATUS" == "200" ]]; then
              echo "::notice::$CRATE $VERSION is already on crates.io; skipping."
            else
              UNPUBLISHED+=("$CRATE")
            fi
          done
          echo "unpublished=${UNPUBLISHED[*]}" >> "$GITHUB_OUTPUT"
      - name: Authenticate with crates.io
        if: steps.crates.outputs.unpublished != ''
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish the Crates
        # In dependency order: fhy-core-py depends on the fhy-core of the
        # same release, and cargo waits until a published crate is usable.
        if: steps.crates.outputs.unpublished != ''
        run: |
          for CRATE in ${{ steps.crates.outputs.unpublished }}; do
            cargo publish --locked --package "$CRATE"
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
