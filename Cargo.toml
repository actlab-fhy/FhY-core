[workspace]
resolver = "2"
members = ["rust/fhy-core", "rust/fhy-core-py", "rust/fhy-core-ext"]

[workspace.package]
# Also the Python package version: maturin derives it from this one.
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Christopher Priebe <cpriebe@ucsd.edu>"]
license = "BSD-3-Clause"
repository = "https://github.com/actlab-fhy/FhY-core"

[workspace.dependencies]
# The binding's, which also holds the SymPy backend; fhy-core has no pyo3.
# One version for the workspace: pyo3-ffi links `python`, so a build holds
# one.
pyo3 = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
num-bigint = "0.5"
num-traits = "0.2"
# The error function of the native built-in `erf`.
libm = "0.2"
# The array backend of the evaluator, behind fhy-core's `ndarray` feature.
ndarray = { version = "0.17", default-features = false, features = ["std"] }
# The NumPy arrays of the binding's evaluator.
numpy = "0.29"
proptest = "1"
# The non-self-describing format the serialization round-trip tests use.
postcard = { version = "1", default-features = false, features = ["alloc"] }
rstest = "0.27"
# The z3 backend of `fhy_core::solver`, behind the off-by-default `z3` feature.
z3 = "0.21"
fhy-core = { path = "rust/fhy-core" }

[workspace.lints.rust]
# docs.rs builds with `--cfg docsrs` (fhy-core's `[package.metadata.docs.rs]`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unnameable_types = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
map_err_ignore = "warn"
let_underscore_must_use = "warn"
partial_pub_fields = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
cargo_common_metadata = "warn"
mod_module_files = "warn"
