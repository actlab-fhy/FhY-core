[workspace]
resolver = "2"
members = ["rust/fhy-core", "rust/fhy-core-py"]

[workspace.package]
# Also the Python package version: maturin derives it from this one.
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Christopher Priebe <cpriebe@ucsd.edu>"]
license = "BSD-3-Clause"
repository = "https://github.com/actlab-fhy/FhY-core.git"

[workspace.dependencies]
pyo3 = "0.29"
serde = { version = "1", features = ["derive"] }
# Integer literals of any size serialize as JSON integers, as Python writes
# them; `arbitrary_precision` lets `serde_json::Number` carry the digits.
# Cargo unifies features across the build graph, so this turns the feature
# on for every crate in a build that includes fhy-core: there a `Number`
# keeps its source text, so `1.0` and `1.00` compare unequal. The fhy-core
# crate docs tell dependents.
serde_json = { version = "1", features = ["arbitrary_precision"] }
num-bigint = "0.5"
num-traits = "0.2"
proptest = "1"
# The non-self-describing format the serialization round-trip tests use.
postcard = { version = "1", default-features = false, features = ["alloc"] }
rstest = "0.27"
fhy-core = { path = "rust/fhy-core" }

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unnameable_types = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
map_err_ignore = "warn"
let_underscore_must_use = "warn"
partial_pub_fields = "warn"
