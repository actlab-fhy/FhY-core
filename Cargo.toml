[package]
name = "fhy-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.83"
authors = ["Christopher Priebe <cpriebe@ucsd.edu>"]
description = "Core utilities for the FhY compiler infrastructure."
license = "BSD-3-Clause"
repository = "https://github.com/actlab-fhy/FhY-core.git"

[lib]
name = "fhy_core"
crate-type = ["rlib"]
path = "rust/src/lib.rs"

# The package-root `tests/` directory holds the Python test suite, so Rust
# integration tests need explicit `[[test]]` entries pointing at `rust/tests/`.
[[test]]
name = "interned_equivalence"
path = "rust/tests/interned_equivalence.rs"

[[test]]
name = "interned_stories"
path = "rust/tests/interned_stories.rs"

[[test]]
name = "tag_type_equivalence"
path = "rust/tests/tag_type_equivalence.rs"

[[test]]
name = "tag_type_stories"
path = "rust/tests/tag_type_stories.rs"

[features]
default = []
python = ["dep:pyo3"]
# Exposes `fhy_core::testing`, the deterministic-identifier scope, to other
# crates' tests. Enable it from `[dev-dependencies]`, never for a production
# build.
testing = []

[dependencies]
pyo3 = { version = "0.29", optional = true, features = ["extension-module"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
petgraph = "0.7"
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Turns on `testing` for this crate's own integration tests. Resolver 2 unifies
# dev-dependency features only into test, example and bench builds, so a
# normal build of the library never sees it.
fhy-core = { path = ".", features = ["testing"] }
pretty_assertions = "1"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unnameable_types = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
map_err_ignore = "warn"
let_underscore_must_use = "warn"
partial_pub_fields = "warn"
