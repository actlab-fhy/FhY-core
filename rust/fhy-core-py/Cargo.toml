[package]
name = "fhy-core-py"
description = "The PyO3 binding of fhy-core as a library: registers fhy_core's Python classes into an extension module."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "fhy_core_py"
crate-type = ["rlib"]

[dependencies]
fhy-core = { workspace = true, features = ["ndarray"] }
num-traits = { workspace = true }
numpy = { workspace = true }
pyo3 = { workspace = true, features = ["macros"] }
# The V2 wire format: the Rust-backed classes serialize their core values
# with serde, as JSON text.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The SymPy backend's stories and properties, which run in an embedded
# interpreter.
proptest = { workspace = true }
rstest = { workspace = true }

[lints]
workspace = true
