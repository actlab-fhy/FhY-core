[package]
name = "fhy-core-py"
description = "PyO3 extension module exposing fhy-core to Python as fhy_core._rs."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "fhy_core_py"
crate-type = ["cdylib"]

[dependencies]
fhy-core = { workspace = true, features = ["ndarray"] }
num-traits = { workspace = true }
numpy = { workspace = true }
pyo3 = { workspace = true, features = ["macros"] }
# The V2 wire format (slice S17): the Rust-backed classes serialize their
# core values with serde, as JSON text.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The SymPy backend's stories and properties (J-10 of
# docs/design/rust-port-fixes.md), which run in an embedded interpreter.
proptest = { workspace = true }
rstest = { workspace = true }

[lints]
workspace = true
