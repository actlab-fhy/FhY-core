[package]
name = "fhy-core-py"
description = "The PyO3 binding of fhy-core as a library: registers fhy_core's Python classes into an extension module."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/fhy-core-py"
keywords = ["python", "pyo3", "bindings", "compiler", "ir"]
categories = ["api-bindings", "compilers"]
# Ship the sources, with the SymPy prelude they embed; the tests are unit
# tests inside them. Cargo.toml and Cargo.lock are always included.
include = ["/src/**/*.rs", "/src/**/*.py", "/README.md", "/LICENSE"]

[lib]
name = "fhy_core_py"
crate-type = ["rlib"]

[dependencies]
fhy-core = { workspace = true, features = ["ndarray"] }
num-traits = { workspace = true }
numpy = { workspace = true }
pyo3 = { workspace = true, features = ["macros"] }
# The V2 wire format: the Rust-backed classes serialize their core values
# with serde, as JSON text.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The SymPy backend's stories and properties, which run in an embedded
# interpreter.
proptest = { workspace = true }
rstest = { workspace = true }

[features]
# Test-only, not stable API: exposes `util::testing`, the `fhy_core` stand-ins of the
# embedded-interpreter tests, so a downstream `-py` crate's tests share them.
# Enable it in `[dev-dependencies]` only.
testing = []

[lints]
workspace = true
