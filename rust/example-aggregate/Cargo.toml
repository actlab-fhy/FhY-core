[package]
name = "fhy-core-example-aggregate"
description = "Test-only aggregate extension: fhy-core-py plus two layers (fhy_example and fhy_example_search), the proof that downstream bindings compose with fhy_core."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "fhy_example_aggregate"
crate-type = ["cdylib"]

[dependencies]
fhy-core = { workspace = true }
fhy-core-py = { path = "../fhy-core-py" }
pyo3 = { workspace = true, features = ["macros"] }
# The foreign payloads of the two search-space kinds.
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
