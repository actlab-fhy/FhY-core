[package]
name = "fhy-core"
description = "Core IR building blocks for the FhY compiler: identifiers, interned tags, diagnostics, symbolic expressions, rewrite rules, a pass manager and a solver with pluggable backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/fhy-core"
keywords = ["compiler", "ir", "symbolic", "term-rewriting", "pass-manager"]
categories = ["compilers", "data-structures"]
# Ship the sources, the integration tests and their golden JSON; never the
# Python corpus generators. Cargo.toml and Cargo.lock are always included.
include = [
    "/src/**/*.rs",
    "/src/**/*.py",
    "/tests/**/*.rs",
    "/tests/golden/*.json",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "fhy_core"

[dependencies]
libm = { workspace = true }
ndarray = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true }
z3 = { workspace = true, optional = true }

[features]
# The `Z3Solver` backend of `fhy_core::solver`, which links libz3 through
# the `z3` crate (see the README for how to choose the link method).
z3 = ["dep:z3"]
# The array backend of `expression::evaluate` (slice S9).
ndarray = ["dep:ndarray"]
# The `SympySimplifier` backend of `fhy_core::solver`, which drives SymPy
# through pyo3 and needs Python with SymPy at run time (see the README).
sympy = ["dep:pyo3"]

[[test]]
# One test in a process without an interpreter, then without SymPy.
name = "sympy_unavailable"
path = "tests/sympy_unavailable.rs"
required-features = ["sympy"]

[dev-dependencies]
postcard = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

